<script>
    function toggleMenu() {
        const menu = document.querySelector(".nav-menu-container");
        const overlay = document.querySelector(".overlay");
        const btn = document.querySelector('.burger-menu');
        const page = document.getElementById("page-content");

        const isOpen = menu.classList.toggle("active");
        overlay.style.display = isOpen ? "block" : "none";

        btn.setAttribute("aria-expanded", isOpen);

        // Make all links in burger menu indexable and lock
        menu.querySelectorAll('a, button').forEach(el => {
            el.setAttribute('tabindex', isOpen ? '0' : '-1');
        });

        if (isOpen) {
            document.body.style.overflow = "hidden"; // Background scroll disabled
            page.setAttribute("inert", "");
            const firstLink = menu.querySelector("a, button");
            if (firstLink) firstLink.focus();
        } else {
            page.removeAttribute("inert");
            btn.focus();
            document.body.style.overflow = ""; // Reset scroll
        }
    }


    document.querySelectorAll('.burger-menu').forEach(el => {
        el.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();   // prevent scroll on space
                toggleMenu();
            }
        });
    });

    const darkModeEnabledByDefault = {{ default false site.Params.DarkModeEnabledByDefault }};
    const darkModeButtonEnabled = {{ default true site.Params.DarkModeButtonEnabled }};

    document.addEventListener("DOMContentLoaded", function () {

        const darkModeButton = document.getElementById("darkModeToggle");

        // Button disabled force configuration
        if (!darkModeButtonEnabled) {

            if (darkModeEnabledByDefault) {
                document.body.classList.add("dark-mode");
            } else {
                document.body.classList.remove("dark-mode");
            }

            return;
        }

        // load settings
        const savedMode = localStorage.getItem("darkMode");

        if (savedMode === "enabled") {
            document.body.classList.add("dark-mode");
        } else if (savedMode === "disabled") {
            document.body.classList.remove("dark-mode");
        } else if (darkModeEnabledByDefault) {
            // first visit
            document.body.classList.add("dark-mode");
        }

        // Button exists?
        if (!darkModeButton) {
            return;
        }

        const isDark = document.body.classList.contains("dark-mode");

        darkModeButton.textContent = isDark ? "☀️" : "🌙";
        darkModeButton.setAttribute("aria-pressed", isDark);

        darkModeButton.addEventListener("click", function () {

            const isDark = document.body.classList.toggle("dark-mode");

            this.setAttribute("aria-pressed", isDark);
            this.textContent = isDark ? "☀️" : "🌙";

            localStorage.setItem(
                "darkMode",
                isDark ? "enabled" : "disabled"
            );
        });
    });

    window.onscroll = function () {
        const scrollTopBtn = document.getElementById("scrollTopBtn");
        if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
            scrollTopBtn.classList.add("visible");
            scrollTopBtn.setAttribute("tabindex", "99");
        } else {
            scrollTopBtn.classList.remove("visible");
            scrollTopBtn.setAttribute("tabindex", "-1");
        }
    };

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        document.getElementById("ariaLive").textContent = "button click";
    }


    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".has-submenu > a").forEach(item => {
            item.addEventListener("click", function (event) {
                event.preventDefault();
                let submenu = this.nextElementSibling;
                let isActive = submenu.style.display === "block";
                document.querySelectorAll(".submenu").forEach(menu => menu.style.display = "none");
                document.querySelectorAll(".has-submenu").forEach(item => item.classList.remove("active"));
                if (!isActive) {
                    submenu.style.display = "block";
                    this.parentElement.classList.add("active");
                }
            });
        });

        document.addEventListener("click", function (event) {
            if (!event.target.closest(".has-submenu")) {
                document.querySelectorAll(".submenu").forEach(menu => menu.style.display = "none");
                document.querySelectorAll(".has-submenu").forEach(item => item.classList.remove("active"));
            }
        });
    });
    // function for fixing menu point width and height if there are too much items for the screen
    function adjustNavigation() {
        const container = document.querySelector('.nav-container');
        const navMenu = document.querySelector('.nav-menu');
        const navLeft = document.querySelector('.nav-left');
        const burger = document.querySelector('.burger-menu');
        container.classList.remove('mobile-mode');
        const requiredWidth = navLeft.offsetWidth + navMenu.scrollWidth + 40;
        const availableWidth = container.offsetWidth;
        if (requiredWidth > availableWidth) {
            container.classList.add('mobile-mode');
        }
    }

    window.addEventListener('resize', adjustNavigation);
    document.addEventListener('DOMContentLoaded', adjustNavigation);
</script>
